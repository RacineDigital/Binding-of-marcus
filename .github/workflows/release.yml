name: Release

# Publishes a GitHub Release with the downloadable game whenever:
#   - a commit changes package.json or the release packaging (the release is tagged v<version>), or
#   - a tag like v1.2.0 is pushed.
# The Linux job publishes the browser builds; the Windows job adds the .exe installer and a
# portable .exe. Nothing is published if a release for that version already exists.
on:
  push:
    branches: ['**']
    paths: ['package.json', 'scripts/package-release.sh', '.github/release/**', '.github/workflows/release.yml', 'electron/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.skip != 'true'
        run: npm ci
      - if: steps.version.outputs.skip != 'true'
        run: npm test
      - if: steps.version.outputs.skip != 'true'
        run: npm run test:desktop
      - name: Build and package
        if: steps.version.outputs.skip != 'true'
        run: bash scripts/package-release.sh "${{ steps.version.outputs.tag }}"
      # start the built game before anything is published: a page that won't load never ships
      - name: Boot test the built game
        if: steps.version.outputs.skip != 'true'
        run: npm run test:boot
      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed -e "s/VERSION/$TAG/g" -e "s/X\.Y\.Z/${TAG#v}/g" .github/release/notes.md > release-notes.md
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Lost Marcus $TAG" \
            --notes-file release-notes.md

  windows:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Windows app
        run: npm run dist:win
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release-desktop/win-unpacked" -Filter "*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Packaged app self-test failed ($($p.ExitCode))"; exit 1 }
          Write-Host "Packaged app self-test passed"
      - name: Attach the .exe files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        # latest.yml and the .blockmap are what installed copies read to update themselves
        run: gh release upload "$TAG" release-desktop/*.exe release-desktop/latest.yml release-desktop/*.blockmap --clobber
