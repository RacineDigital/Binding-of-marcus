name: Desktop build check

# Builds and self-tests the Windows .exe and the Steam depot on every push that touches the desktop
# app or the game, and keeps both as downloadable workflow artifacts for testing between releases.
on:
  push:
    branches: ['**']
    paths: ['electron/**', 'src/**', 'steam/**', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/desktop-check.yml']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release-desktop/win-unpacked" -Filter "*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Packaged app self-test failed ($($p.ExitCode))"; exit 1 }
          Write-Host "Packaged app self-test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: lost-marcus-windows
          path: release-desktop/*.exe
          retention-days: 14

  steam:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:steam
      - name: Self-test the Steam depot
        shell: pwsh
        # no Steam on the runner: the game must still start, with the Steamworks library loaded and idle
        run: |
          $dir = "release-steam/win-unpacked"
          foreach ($f in @("steam_api64.dll", "THIRD_PARTY_NOTICES.txt", "resources/game/index.html", "resources/game/music/cellar.ogg")) { if (-not (Test-Path "$dir/$f")) { Write-Error "$f is missing from the depot"; exit 1 } }
          if (-not (Test-Path "$dir/resources/app.asar.unpacked/node_modules/steamworks.js/dist/win64/steamworksjs.win32-x64-msvc.node")) { Write-Error "the Steamworks module was not unpacked"; exit 1 }
          $exe = Get-ChildItem $dir -Filter "*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke" -Wait -PassThru -RedirectStandardOutput smoke.txt
          $out = Get-Content smoke.txt -Raw
          Write-Host $out
          if ($p.ExitCode -ne 0) { Write-Error "Steam depot self-test failed ($($p.ExitCode))"; exit 1 }
          if ($out -match "steamworks.js unavailable") { Write-Error "the Steamworks library did not load"; exit 1 }
          Write-Host "Steam depot self-test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: lost-marcus-steam-depot
          path: release-steam/win-unpacked
          retention-days: 14
